name: TriageRemote
options:
  bundleIdPrefix: com.alenlvovich
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5ZC643A2XK
    CODE_SIGN_STYLE: Automatic
targets:
  Triage:
    type: application
    platform: iOS
    sources:
      - path: Triage
    settings:
      base:
        PRODUCT_NAME: Triage
        PRODUCT_BUNDLE_IDENTIFIER: com.alenlvovich.triage.ios
        INFOPLIST_FILE: Triage/Info.plist
        CODE_SIGN_ENTITLEMENTS: Triage/Triage.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    dependencies:
      - target: TriageWidgets
  TriageWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: TriageWidgets
      - path: Triage/Sources/Theme.swift
      - path: Triage/Sources/WidgetSnap.swift
    settings:
      base:
        PRODUCT_NAME: TriageWidgets
        PRODUCT_BUNDLE_IDENTIFIER: com.alenlvovich.triage.ios.widgets
        INFOPLIST_FILE: TriageWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: TriageWidgets/TriageWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
