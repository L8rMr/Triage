name: TestFlight build status
on: workflow_dispatch
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Ask App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests, json
          k = os.environ["ASC_KEY_P8"]
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           k, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          h = {"Authorization": "Bearer " + tok}
          apps = requests.get("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.alenlvovich.triage.ios", headers=h).json()
          app = apps["data"][0]["id"]
          b = requests.get(f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app}&sort=-uploadedDate&limit=12&include=buildBetaDetail", headers=h).json()
          det = {i["id"]: i["attributes"] for i in b.get("included", [])}
          for x in b["data"]:
              a = x["attributes"]
              bd = x["relationships"]["buildBetaDetail"]["data"]["id"]
              print(a["version"], a["uploadedDate"], "processing:", a["processingState"], "expired:", a["expired"],
                    "encryption:", a.get("usesNonExemptEncryption"), "internal:", det.get(bd, {}).get("internalBuildState"),
                    "external:", det.get(bd, {}).get("externalBuildState"))
          g = requests.get(f"https://api.appstoreconnect.apple.com/v1/apps/{app}/betaGroups", headers=h).json()
          for x in g["data"]:
              print("group:", x["attributes"]["name"], "internal:", x["attributes"]["isInternalGroup"], "allBuilds:", x["attributes"].get("hasAccessToAllBuilds"))
          PY
