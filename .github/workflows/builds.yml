name: TestFlight build status
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/builds.yml', '.github/check-builds']
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Ask App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests, json
          k = os.environ["ASC_KEY_P8"]
          tok = jwt.encode({"iss": os.environ["ASC_ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           k, algorithm="ES256", headers={"kid": os.environ["ASC_KEY_ID"]})
          h = {"Authorization": "Bearer " + tok}
          apps = requests.get("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.alenlvovich.triage.ios", headers=h).json()
          app = apps["data"][0]["id"]
          b = requests.get(f"https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app}&sort=-uploadedDate&limit=12&include=buildBetaDetail", headers=h).json()
          det = {i["id"]: i["attributes"] for i in b.get("included", [])}
          for x in b["data"]:
              a = x["attributes"]
              bd = x["relationships"]["buildBetaDetail"]["data"]["id"]
              print(a["version"], a["uploadedDate"], "processing:", a["processingState"], "expired:", a["expired"],
                    "encryption:", a.get("usesNonExemptEncryption"), "internal:", det.get(bd, {}).get("internalBuildState"),
                    "external:", det.get(bd, {}).get("externalBuildState"))
          api = "https://api.appstoreconnect.apple.com/v1"
          g = requests.get(f"{api}/apps/{app}/betaGroups", headers=h).json()
          print("groups:", json.dumps(g)[:600])
          group = next((x for x in g.get("data", []) if x["attributes"]["isInternalGroup"]), None)
          if group is None:
              r = requests.post(f"{api}/betaGroups", headers=h, json={"data": {"type": "betaGroups",
                  "attributes": {"name": "Me", "isInternalGroup": True, "hasAccessToAllBuilds": True},
                  "relationships": {"app": {"data": {"type": "apps", "id": app}}}}})
              print("create group:", r.status_code, r.text[:400])
              group = r.json().get("data")
          gid = group["id"]
          users = requests.get(f"{api}/users?limit=50", headers=h).json()
          print("users:", users.get("errors") or [(u["attributes"]["username"], u["attributes"]["roles"]) for u in users.get("data", [])])
          for u in users.get("data", []):
              email = u["attributes"]["username"]
              r = requests.post(f"{api}/betaTesters", headers=h, json={"data": {"type": "betaTesters",
                  "attributes": {"email": email, "firstName": u["attributes"].get("firstName", ""), "lastName": u["attributes"].get("lastName", "")},
                  "relationships": {"betaGroups": {"data": [{"type": "betaGroups", "id": gid}]}}}})
              print("add tester", email, r.status_code, r.text[:300])
          t = requests.get(f"{api}/betaGroups/{gid}/betaTesters", headers=h).json()
          print("testers now:", [x["attributes"].get("email") for x in t.get("data", [])])
          PY
